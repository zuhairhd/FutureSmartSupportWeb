<!doctype html><html><head><meta charset="utf-8"><title>Type scale</title>
<link rel="stylesheet" href="_card.css"><style>
.row { gap: 28px; align-items: baseline; }
.spec { display: flex; flex-direction: column; gap: 4px; }
.spec .sample { line-height: 1; letter-spacing: -0.02em; }
.spec .meta { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--muted); }
</style></head><body>
<div class="row" style="flex-wrap: wrap; align-items: flex-end;">
  <div class="spec">
    <span class="sample" style="font-size: 48px; font-weight: 800; color: var(--brand);">372</span>
    <span class="meta">Display · 48 / 800</span>
  </div>
  <div class="spec">
    <span class="sample" style="font-size: 42px; font-weight: 700;">Headline</span>
    <span class="meta">H1 · 42 / 700</span>
  </div>
  <div class="spec">
    <span class="sample" style="font-size: 30px; font-weight: 700;">Section title</span>
    <span class="meta">H2 · 30 / 700</span>
  </div>
  <div class="spec">
    <span class="sample" style="font-size: 17px; font-weight: 600;">Card heading</span>
    <span class="meta">H3 · 17 / 600</span>
  </div>
</div>
</body></html>
