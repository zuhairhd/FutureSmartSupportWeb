<!doctype html><html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css"><style>
.row { gap: 18px; align-items: flex-end; flex-wrap: wrap; }
.box {
  width: 80px; height: 60px;
  background: var(--surface);
  border: 1px solid var(--line);
}
.col { gap: 6px; align-items: flex-start; }
.tok { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--muted); }
.val { font-size: 12px; font-weight: 600; color: var(--brand); }
</style></head><body>
<div class="row">
  <div class="col"><div class="box" style="border-radius:8px"></div><span class="val">8 px</span><span class="tok">--radius-sm</span></div>
  <div class="col"><div class="box" style="border-radius:10px"></div><span class="val">10 px</span><span class="tok">--radius-md · input</span></div>
  <div class="col"><div class="box" style="border-radius:12px"></div><span class="val">12 px</span><span class="tok">--radius-lg · button</span></div>
  <div class="col"><div class="box" style="border-radius:16px"></div><span class="val">16 px</span><span class="tok">--radius-xl · card</span></div>
  <div class="col"><div class="box" style="border-radius:999px;width:120px;"></div><span class="val">999 px</span><span class="tok">--radius-pill · badge</span></div>
</div>
</body></html>
