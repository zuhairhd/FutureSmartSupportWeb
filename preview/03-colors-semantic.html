<!doctype html><html><head><meta charset="utf-8"><title>Semantic colors</title>
<link rel="stylesheet" href="_card.css"><style>
.pill {
  flex: 1;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--surface);
}
.pill .led { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 4px rgba(255,255,255,0.04); }
.pill .led.s { background: #6fbf73; box-shadow: 0 0 12px #6fbf73, 0 0 0 4px rgba(111,191,115,0.18); }
.pill .led.w { background: #d4a029; box-shadow: 0 0 12px #d4a029, 0 0 0 4px rgba(212,160,41,0.18); }
.pill .led.e { background: #e05c5c; box-shadow: 0 0 12px #e05c5c, 0 0 0 4px rgba(224,92,92,0.18); }
.name { font-weight: 600; font-size: 14px; }
.hex { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
</style></head><body>
<div class="row">
  <div class="pill">
    <span class="led s"></span>
    <div><div class="name">Success</div><div class="hex">#6fbf73 · --success</div></div>
  </div>
  <div class="pill">
    <span class="led w"></span>
    <div><div class="name">Warning</div><div class="hex">#d4a029 · --warning</div></div>
  </div>
  <div class="pill">
    <span class="led e"></span>
    <div><div class="name">Error</div><div class="hex">#e05c5c · --error</div></div>
  </div>
</div>
</body></html>
