<!doctype html><html><head><meta charset="utf-8"><title>Eyebrow + price</title>
<link rel="stylesheet" href="_card.css"><style>
.row { gap: 32px; align-items: center; flex-wrap: wrap; }
.eyebrow {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--brand);
  font-weight: 600;
}
.price-block { display: flex; align-items: baseline; gap: 10px; }
.price { font-size: 48px; font-weight: 800; color: var(--brand); line-height: 1; letter-spacing: -0.02em; }
.price-l { font-size: 14px; color: var(--muted); }
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: #fff;
  background: linear-gradient(135deg, var(--brand), rgba(184,136,90,0.7));
  padding: 4px 12px;
  border-radius: 999px;
}
.tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--brand);
  background: var(--brand-dim);
  border: 1px solid rgba(184,136,90,0.3);
  padding: 5px 12px;
  border-radius: 999px;
}
.col { gap: 8px; }
.lbl { margin-top: 0; }
</style></head><body>
<div class="row">
  <div class="col">
    <span class="eyebrow">FEATURES</span>
    <span class="lbl">Section eyebrow</span>
  </div>
  <div class="col">
    <span class="badge">Limited Time</span>
    <span class="lbl">Hot badge (gradient)</span>
  </div>
  <div class="col">
    <span class="tag">Local + Cloud</span>
    <span class="lbl">Tag (tinted)</span>
  </div>
  <div class="col">
    <div class="price-block"><span class="price">372</span><span class="price-l">OMR · setup</span></div>
    <span class="lbl">Display price</span>
  </div>
</div>
</body></html>
