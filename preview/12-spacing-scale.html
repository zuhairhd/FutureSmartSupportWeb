<!doctype html><html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_card.css"><style>
.row { gap: 18px; align-items: flex-end; flex-wrap: wrap; }
.step { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.bar { background: var(--brand-dim); border: 1px solid rgba(184,136,90,0.4); height: 28px; border-radius: 4px; }
.tok { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--muted); }
.val { font-size: 12px; font-weight: 600; color: var(--brand); }
</style></head><body>
<div class="row">
  <div class="step"><div class="bar" style="width:4px"></div><div class="val">4</div><div class="tok">--space-1</div></div>
  <div class="step"><div class="bar" style="width:8px"></div><div class="val">8</div><div class="tok">--space-2</div></div>
  <div class="step"><div class="bar" style="width:12px"></div><div class="val">12</div><div class="tok">--space-3</div></div>
  <div class="step"><div class="bar" style="width:16px"></div><div class="val">16</div><div class="tok">--space-4</div></div>
  <div class="step"><div class="bar" style="width:24px"></div><div class="val">24</div><div class="tok">--space-6</div></div>
  <div class="step"><div class="bar" style="width:32px"></div><div class="val">32</div><div class="tok">--space-8</div></div>
  <div class="step"><div class="bar" style="width:48px"></div><div class="val">48</div><div class="tok">--space-12</div></div>
  <div class="step"><div class="bar" style="width:64px"></div><div class="val">64</div><div class="tok">--space-16</div></div>
  <div class="step"><div class="bar" style="width:80px"></div><div class="val">80</div><div class="tok">--space-20</div></div>
</div>
</body></html>
