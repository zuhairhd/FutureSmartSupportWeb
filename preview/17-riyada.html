<!doctype html><html><head><meta charset="utf-8"><title>Riyada partner mark</title>
<link rel="stylesheet" href="_card.css"><style>
.wrap {
  display: flex; align-items: center; gap: 18px;
}
.partner-pill {
  background: #ffffff;
  border-radius: 14px;
  padding: 14px 22px;
  display: inline-flex; align-items: center; gap: 14px;
  border: 1px solid var(--line);
}
.partner-pill img { height: 56px; width: auto; }
.partner-pill .lbl {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #475569;
}
.note {
  flex: 1;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.55;
}
.note strong { color: var(--fg); font-weight: 600; }
</style></head><body>
<div class="wrap">
  <div class="partner-pill">
    <span class="lbl">Member</span>
    <img src="../assets/riyada.png" alt="Riyada — SMEs Development Authority of Oman"/>
  </div>
  <p class="note">
    <strong>Riyada</strong> — SMEs Development Authority of Oman.<br/>
    Co-brand only. <strong>Use on white backgrounds only</strong>; wrap in a white pill when placed on the ink canvas.
  </p>
</div>
</body></html>
