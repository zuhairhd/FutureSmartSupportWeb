<!doctype html><html><head><meta charset="utf-8"><title>Form inputs</title>
<link rel="stylesheet" href="_card.css"><style>
.row { gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 220px; min-width: 200px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field input, .field textarea {
  padding: 11px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,0.03);
  color: var(--fg);
  font: 400 15px var(--font-base);
  outline: none;
  transition: border-color 0.2s;
}
.field.focus input { border-color: var(--brand); }
.field.error input { border-color: var(--error); }
.field.error .helper { font-size: 12px; color: var(--error); }
</style></head><body>
<div class="row">
  <div class="field"><label>Name</label><input value="Layla Al-Saadi" readonly></div>
  <div class="field focus"><label>Email</label><input value="layla@aurora.om" readonly></div>
  <div class="field error">
    <label>Company</label>
    <input value="" readonly placeholder="Required">
    <span class="helper">Please enter your company</span>
  </div>
</div>
</body></html>
