<!doctype html><html><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css"><style>
.row { gap: 12px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; padding: 11px 22px; border-radius: 12px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--fg);
  font: 600 15px var(--font-base);
  cursor: pointer;
  transition: all 0.2s ease;
  text-decoration: none;
}
.btn-primary { background: var(--brand); color: #1a120a; border-color: var(--brand); }
.btn-ghost { color: var(--fg); }
.btn-disabled { opacity: 0.55; cursor: not-allowed; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; color: var(--muted); }
.btn-sm:hover { color: var(--brand); border-color: var(--brand); }
</style></head><body>
<div class="row">
  <button class="btn btn-primary">Request Demo</button>
  <button class="btn btn-ghost">View Special Offer</button>
  <button class="btn btn-primary btn-disabled">Sending…</button>
  <button class="btn btn-sm">العربية</button>
</div>
<div class="lbl" style="margin-top: 14px;">.btn-primary · .btn-ghost · disabled · lang-toggle</div>
</body></html>
