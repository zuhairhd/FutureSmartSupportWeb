<!doctype html><html><head><meta charset="utf-8"><title>Brand colors</title>
<link rel="stylesheet" href="_card.css"><style>
.swatch { flex: 1; min-width: 130px; border-radius: 14px; padding: 14px; border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: space-between; min-height: 110px; }
.swatch .top { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.08); }
.swatch .hex { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
.swatch.brand    { background: #b8885a; color: #1a120a; border-color: transparent; }
.swatch.brand .hex { color: rgba(26,18,10,0.7); }
.swatch.soft     { background: #cdab8f; color: #1a120a; border-color: transparent; }
.swatch.soft .hex { color: rgba(26,18,10,0.7); }
.swatch.dim      { background: rgba(184,136,90,0.15); }
.swatch.glow     { background: rgba(184,136,90,0.30); }
</style></head><body>
<div class="row">
  <div class="swatch brand">
    <div class="top"><span class="dot" style="background:#1a120a"></span> Brand</div>
    <div><div class="hex">#b8885a</div><div class="hex">--brand</div></div>
  </div>
  <div class="swatch soft">
    <div class="top"><span class="dot" style="background:#1a120a"></span> Brand soft</div>
    <div><div class="hex">#cdab8f</div><div class="hex">--brand-soft</div></div>
  </div>
  <div class="swatch dim">
    <div class="top"><span class="dot" style="background:#b8885a"></span> Brand dim</div>
    <div><div class="hex" style="color:var(--muted)">rgba(.15)</div><div class="hex" style="color:var(--muted)">--brand-dim</div></div>
  </div>
  <div class="swatch glow">
    <div class="top"><span class="dot" style="background:#b8885a"></span> Brand glow</div>
    <div><div class="hex" style="color:var(--muted)">rgba(.30)</div><div class="hex" style="color:var(--muted)">--brand-glow</div></div>
  </div>
</div>
</body></html>
