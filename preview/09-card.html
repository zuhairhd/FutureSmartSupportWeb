<!doctype html><html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="_card.css"><style>
.row { gap: 12px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card.hover { background: var(--card-hover); border-color: rgba(184,136,90,0.35); }
.icon-tile {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--brand-dim);
  border: 1px solid rgba(184,136,90,0.25);
  display: grid; place-items: center; color: var(--brand);
}
.card h3 { margin: 0; font-size: 15px; font-weight: 600; }
.card p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.55; }
</style></head><body>
<div class="row">
  <div class="card">
    <div class="icon-tile">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
    </div>
    <h3>24/7 AI Call Answering</h3>
    <p>Never miss a call. Always on, including holidays.</p>
  </div>
  <div class="card hover">
    <div class="icon-tile">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    </div>
    <h3>Arabic & English (hover)</h3>
    <p>Auto-detects language. Border warms on hover.</p>
  </div>
</div>
</body></html>
