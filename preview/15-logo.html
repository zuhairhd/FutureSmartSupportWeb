<!doctype html><html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="_card.css"><style>
.row { gap: 18px; flex-wrap: wrap; align-items: stretch; }
.tile {
  flex: 1; min-width: 220px;
  border-radius: 14px;
  border: 1px solid var(--line);
  padding: 18px;
  display: grid; place-items: center;
  min-height: 100px;
}
.tile img { max-height: 56px; width: auto; }
.tile.dark { background: var(--bg); }
.tile.warm { background: var(--brand-dim); }
.tile.white { background: #ffffff; }
.lbl { margin-top: 8px; text-align: center; }
.col { align-items: stretch; }
</style></head><body>
<div class="row">
  <div class="col" style="flex:1;">
    <div class="tile dark"><img src="../assets/FSS_Logo.svg" alt="FSS"/></div>
    <div class="lbl">FSS Logo · on ink</div>
  </div>
  <div class="col" style="flex:1;">
    <div class="tile warm"><img src="../assets/FSS_Logo.svg" alt="FSS"/></div>
    <div class="lbl">on brand-dim</div>
  </div>
  <div class="col" style="flex:1;">
    <div class="tile white"><img src="../assets/FSS_Logo.svg" alt="FSS"/></div>
    <div class="lbl">on white</div>
  </div>
</div>
</body></html>
