<!doctype html><html><head><meta charset="utf-8"><title>Elevation / shadows</title>
<link rel="stylesheet" href="_card.css"><style>
.row { gap: 18px; align-items: flex-end; flex-wrap: wrap; }
.demo {
  width: 200px; padding: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  font-size: 12px;
  color: var(--muted);
}
.demo.flat { /* no shadow — the default */ }
.demo.scroll { box-shadow: 0 4px 32px rgba(0, 0, 0, 0.50); }
.cta {
  display: inline-block; padding: 10px 18px;
  background: var(--brand); color: #1a120a;
  border-radius: 12px; font-weight: 600; font-size: 13px;
  box-shadow: 0 4px 16px var(--brand-glow);
}
.glow {
  background: var(--card);
  border: 1px solid rgba(184,136,90,0.3);
  box-shadow: 0 0 40px rgba(184, 136, 90, 0.08), 0 0 0 1px var(--line);
}
.col { gap: 6px; align-items: flex-start; }
.tok { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--muted); }
.val { font-size: 11px; font-weight: 600; color: var(--brand); }
</style></head><body>
<div class="row">
  <div class="col"><div class="demo flat">Flat card</div><span class="val">FLAT</span><span class="tok">default</span></div>
  <div class="col"><div class="demo scroll">Sticky header</div><span class="val">--shadow-scroll-header</span><span class="tok">0 4 32 rgba(0,0,0,.5)</span></div>
  <div class="col"><div class="cta">Primary CTA</div><span class="val">--shadow-cta-hover</span><span class="tok">0 4 16 brand-glow</span></div>
  <div class="col"><div class="demo glow">Server card</div><span class="val">--shadow-card-glow</span><span class="tok">0 0 40 brand + ring</span></div>
</div>
</body></html>
